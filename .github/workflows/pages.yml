name: Publish site to gh-pages

# Every push that touches site/ republishes the folder to the gh-pages branch,
# which GitHub Pages serves at https://dnltrrssocinex.github.io/Lunarcore/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add .nojekyll so Pages serves files as-is
        run: touch site/.nojekyll
      - name: Push site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish site from ${{ github.sha }}"
